<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kokree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <section class="profile-card">

      <div class="profile-head">
        <div class="avatar">K</div>
        <div class="profile-info">
          <h1>Kokree <span class="check" aria-label="featured profile">✓</span></h1>
          <p>@kokree <span class="flag">🇺🇸</span></p>
        </div>
      </div>

      <div class="stats">
        <div><strong>500</strong><span>Videos</span></div>
        <div><strong>258</strong><span>Photos</span></div>
        <div><strong>18+</strong><span>Live</span></div>
      </div>

      <div class="actions">
        <button type="button">Follow</button>
        <button type="button">Message</button>
      </div>

      <div class="slider" aria-label="Automatic image slider">
        <div class="slides">
          <img src="https://picsum.photos/900/650?random=21" alt="Profile image 1">
          <img src="https://picsum.photos/900/650?random=22" alt="Profile image 2">
          <img src="https://picsum.photos/900/650?random=23" alt="Profile image 3">
          <img src="https://picsum.photos/900/650?random=24" alt="Profile image 4">
        </div>

        <button class="slider-btn prev" type="button" onclick="moveSlide(-1)" aria-label="Previous image">‹</button>
        <button class="slider-btn next" type="button" onclick="moveSlide(1)" aria-label="Next image">›</button>

        <div class="dots" id="dots"></div>
      </div>

      <div class="notice">
        <strong>18+ ONLY</strong>
        <p>This page is intended for adults. Please continue only if you are 18 or older.</p>
      </div>

    </section>
  </main>

  <script>
    let currentSlide = 0;
    const slides = document.querySelector(".slides");
    const images = document.querySelectorAll(".slides img");
    const dots = document.getElementById("dots");

    images.forEach((_, i) => {
      const dot = document.createElement("span");
      dot.className = i === 0 ? "dot active" : "dot";
      dot.onclick = () => showSlide(i);
      dots.appendChild(dot);
    });

    function showSlide(index) {
      currentSlide = (index + images.length) % images.length;
      slides.style.transform = `translateX(-${currentSlide * 100}%)`;
      document.querySelectorAll(".dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === currentSlide);
      });
    }

    function moveSlide(direction) {
      showSlide(currentSlide + direction);
    }

    setInterval(() => moveSlide(1), 3000);
  </script>

</body>
</html>
