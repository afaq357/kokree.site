<body>

<main class="page">

  <section class="profile">

    <!-- PROFILE -->

      <div class="profile-photo">

      <div class="profile-details">

          KOKREE

        <!-- STARS -->

        <!-- VIDEOS / PHOTOS -->
        <div class="numbers">

  <span class="video-icon">▣</span>

  <span class="photo-icon">▧</span>
  <b>340</b>
  <span>photos</span>

        </div>

      </div>

    </div>


    <!-- JERKMATE AD -->
    <div class="jerkmate-ad">

      <a
        href="https://t.ajrkmx3.com/421332/8780/0?source=Facebook&file_id=610753&aff_sub5=SF_006OG000004lmDN&aff_sub4=AT_0002"
        target="_blank"
        rel="noopener"

        <img
          src="https://www.imglnkx.com/8780/009379E_JRKM_18_ALL_EN_55_L.gif"
          alt="Jerkmate"
        >

      </a>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

      <a
        class="action-btn"
        href="https://t.ajrkmx3.com/421332/8780/32511?source=Facebook&po=6533&aff_sub5=SF_006OG000004lmDN"
        target="_blank"
        rel="noopener"

        <span>▶</span>
        +18 Livestream
      </a>

      <a
        class="action-btn"
        href="https://t.ajrkmx3.com/421332/8780/0?source=Facebook&aff_sub5=SF_006OG000004lmDN"
        target="_blank"
        rel="noopener"
      >
        <span>▧</span>
        Explicit Content
      </a>

    </div>


    <!-- IMAGE SLIDER -->

    <div class="slider">

      <div class="slides">

        <img src="/model1.jpg" alt="Kokree photo">
        <img src="/model2.jpg" alt="Kokree photo">
        <img src="/model3.jpg" alt="Kokree photo">

      </div>

      <button class="prev" onclick="moveSlide(-1)">‹</button>
      <button class="next" onclick="moveSlide(1)">›</button>

    </div>

  </section>

</main>


<script>

let currentSlide = 0;

const slides = document.querySelector(".slides");
const totalSlides = document.querySelectorAll(".slides img").length;

function showSlide() {
  slides.style.transform =
    "translateX(-" + (currentSlide * 100) + "%)";
}

function moveSlide(direction) {

  currentSlide += direction;

  if (currentSlide >= totalSlides) {
    currentSlide = 0;
  }

  if (currentSlide < 0) {
    currentSlide = totalSlides - 1;
  }

  showSlide();
}


/* AUTOMATIC SLIDE */

setInterval(function() {
  moveSlide(1);
}, 3000);

</script>

</body>
