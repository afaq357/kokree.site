<!-- IMAGE SLIDER SCRIPT -->

<script>

let currentSlide = 0;

const slides = document.querySelector(".slides");

const totalSlides =
  document.querySelectorAll(".slides img").length;


function showSlide() {

  slides.style.transform =
    "translateX(-" +
    (currentSlide * 100) +
    "%)";

}


function moveSlide(direction) {

  currentSlide += direction;


  if (currentSlide >= totalSlides) {

    currentSlide = 0;

  }


  if (currentSlide < 0) {

    currentSlide =
      totalSlides - 1;

  }


  showSlide();

}


/* AUTOMATIC SLIDE */

setInterval(function() {

  moveSlide(1);

}, 3000);

</script>
