<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kokree</title>

  <link rel="stylesheet" href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
    }

    .profile {
      width: 100%;
      padding: 18px 16px 30px;
    }

    /* ================= PROFILE ================= */

    .profile-top {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
    }

    .profile-photo {
      position: relative;
      flex-shrink: 0;
    }

    .profile-photo img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .online {
      position: absolute;
      right: 2px;
      bottom: 5px;
      width: 24px;
      height: 24px;
      background: #19c52b;
      border: 4px solid white;
      border-radius: 50%;
    }

    .profile-details {
      flex: 1;
      min-width: 0;
    }

    .profile-details h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: #304bdc;
      color: white;
      border-radius: 50%;
      font-size: 14px;
      vertical-align: middle;
    }

    .flag {
      font-size: 27px;
      margin-left: 4px;
    }

    /* ================= STARS ================= */

    .stars {
      color: #f7bd00;
      font-size: 29px;
      letter-spacing: 1px;
      line-height: 1;
      margin-bottom: 12px;
    }

    /* ================= NUMBERS ================= */

    .numbers {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 17px;
      color: #d05b9b;
    }

    .numbers b {
      font-size: 20px;
      color: #d05b9b;
    }

    .numbers span {
      color: #d05b9b;
    }

    .video-icon,
    .photo-icon {
      display: inline-flex;
      width: 23px;
      height: 23px;
      align-items: center;
      justify-content: center;
      color: #24348d !important;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .video-icon svg,
    .photo-icon svg {
      width: 23px;
      height: 23px;
    }

    /* ================= JERKMATE BANNER ================= */

    .jerkmate-banner {
      width: 100%;
      display: block;
      margin: 10px 0 18px;
      text-align: center;
      overflow: hidden;
    }

    .jerkmate-banner img {
      display: block;
      width: 300px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      border: 0;
    }

    /* ================= BUTTONS ================= */

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 16px 0 24px;
      padding: 0 34px;
    }

    .action-btn {
      width: 100%;
      height: 38px;
      min-height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 22px;

      background: #1235c5;
      color: #fff;

      font-size: 16px;
      font-weight: 700;

      text-decoration: none;
      cursor: pointer;

      gap: 7px;
      padding: 0 10px;
    }

    .action-btn:hover {
      opacity: .92;
    }

    .action-btn:active {
      transform: scale(.98);
    }

    .action-btn .icon {
      font-size: 17px;
      line-height: 1;
    }

    /* ================= SLIDER ================= */

    .slider {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #eee;
      margin: 15px 0 20px;
      aspect-ratio: 2 / 3;
    }

    .slides {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform .5s ease;
    }

    .slides img {
      display: block;
      width: 100%;
      min-width: 100%;
      flex: 0 0 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ================= ARROWS ================= */

    .prev,
    .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 42px;
      height: 42px;
