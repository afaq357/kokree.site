<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kokree</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #fff;
  color: #111;
}

body {
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 700px;
  min-height: 100vh;
  background: #fff;
}

.profile {
  width: 100%;
  padding: 18px 16px 30px;
}


/* ================= PROFILE ================= */

.profile-top {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 18px;
}

.profile-photo {
  position: relative;
  flex-shrink: 0;
}

.profile-photo img {
  width: 105px;
  height: 105px;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}

.online {
  position: absolute;
  right: 2px;
  bottom: 5px;
  width: 24px;
  height: 24px;
  background: #19c52b;
  border: 4px solid white;
  border-radius: 50%;
}

.profile-details {
  flex: 1;
  min-width: 0;
}

.profile-details h1 {
  margin: 0 0 6px;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 1px;
}

.verified {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  background: #304bdc;
  color: white;
  border-radius: 50%;
  font-size: 14px;
  vertical-align: middle;
}

.flag {
  font-size: 27px;
  margin-left: 4px;
}


/* ================= STARS ================= */

.stars {
  color: #f7bd00;
  font-size: 29px;
  letter-spacing: 1px;
  line-height: 1;
  margin-bottom: 12px;
}


/* ================= NUMBERS ================= */

.numbers {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 17px;
  color: #d05b9b;
}

.numbers b {
  font-size: 20px;
  color: #d05b9b;
}

.numbers span {
  color: #d05b9b;
}

.video-icon,
.photo-icon {
  display: inline-flex;
  width: 23px;
  height: 23px;
  align-items: center;
  justify-content: center;
  color: #24348d !important;
  margin-left: 2px;
  flex-shrink: 0;
}

.video-icon svg,
.photo-icon svg {
  width: 23px;
  height: 23px;
}


/* ================= BUTTONS ================= */

.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 16px 0 24px;
  padding: 0 34px;
}

.action-btn {
  width: 100%;
  height: 38px;
  min-height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
  border-radius: 22px;

  background: #1235c5;
  color: #fff;

  font-size: 16px;
  font-weight: 700;

  text-decoration: none;
  cursor: pointer;

  gap: 7px;
  padding: 0 10px;
}

.action-btn .icon {
  font-size: 17px;
  line-height: 1;
}


/* ================= SLIDER ================= */

.slider {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #eee;
  margin: 15px 0 20px;
  aspect-ratio: 2 / 3;
}

.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform .5s ease;
}

.slides img {
  display: block;
  width: 100%;
  min-width: 100%;
  flex: 0 0 100%;
  height: 100%;
  object-fit: cover;
}


/* ================= SLIDER ARROWS ================= */

.prev,
.next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);

  width: 45px;
  height: 60px;

  border: 0;
  background: transparent;
  color: #fff;

  font-size: 55px;
  font-weight: bold;
  line-height: 55px;

  z-index: 5;
  cursor: pointer;

  padding: 0;

  text-shadow: 0 2px 5px rgba(0,0,0,.7);
}

.prev {
  left: 5px;
}

.next {
  right: 5px;
}


/* ================================================= */
/* ===================== MOBILE ==================== */
/* ================================================= */

@media (max-width: 480px) {

  .page {
    width: 100%;
    max-width: 100%;
  }

  .profile {
    padding: 16px 0 25px;
  }

  .profile-top {
    width: 100%;
    padding: 0 12px;
    gap: 12px;
  }

  .profile-photo img {
    width: 100px;
    height: 100px;
  }

  .online {
    width: 22px;
    height: 22px;
  }

  .profile-details h1 {
    font-size: 27px;
  }

  .stars {
    font-size: 30px;
  }

  .numbers {
    font-size: 16px;
    gap: 6px;
  }

  .numbers b {
    font-size: 17px;
  }

  .buttons {
    width: 100%;
    padding: 0 34px;
    margin: 14px 0 20px;
    gap: 12px;
  }

  .action-btn {
    width: 100%;
    height: 38px;
    min-height: 38px;
    border-radius: 22px;
    font-size: 16px;
  }

  .slider {
    width: 100%;
    aspect-ratio: 2 / 3;
  }

  .slides {
    width: 100%;
    height: 100%;
  }

  .slides img {
    width: 100%;
    min-width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .prev,
  .next {
    width: 45px;
    height: 60px;
    font-size: 55px;
  }

}

</style>

</head>


<body>

<main class="page">

<section class="profile">


<!-- ================= PROFILE ================= -->

<div class="profile-top">

  <div class="profile-photo">

    <img src="/profile.jpg" alt="Kokree">

    <span class="online"></span>

  </div>


  <div class="profile-details">

    <h1>
      KOKREE
      <span class="verified">✓</span>
      <span class="flag">🇺🇸</span>
    </h1>

    <div class="stars">
      ★★★★★
    </div>

    <div class="numbers">

      <span class="video-icon">

        <svg viewBox="0 0 32 32">

          <rect x="3" y="5" width="26" height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5" />

          <line x1="3" y1="10" x2="29" y2="10"
            stroke="currentColor"
            stroke-width="2.5" />

          <circle cx="8" cy="7.5" r="1" fill="currentColor"/>
          <circle cx="12" cy="7.5" r="1" fill="currentColor"/>
          <circle cx="16" cy="7.5" r="1" fill="currentColor"/>

          <rect x="7" y="14" width="3" height="3" fill="currentColor"/>
          <rect x="13" y="14" width="3" height="3" fill="currentColor"/>
          <rect x="19" y="14" width="3" height="3" fill="currentColor"/>

          <rect x="7" y="20" width="3" height="3" fill="currentColor"/>
          <rect x="13" y="20" width="3" height="3" fill="currentColor"/>
          <rect x="19" y="20" width="3" height="3" fill="currentColor"/>

        </svg>

      </span>

      <b>205</b>
      <span>videos</span>


      <span class="photo-icon">

        <svg viewBox="0 0 32 32">

          <rect x="3" y="4" width="26" height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5" />

          <circle cx="10" cy="11" r="2.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2" />

          <path d="M5 24 L13 16 L18 21 L21 18 L27 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5" />

        </svg>

      </span>

      <b>340</b>
      <span>photos</span>

    </div>

  </div>

</div>


<!-- ================= BUTTONS ================= -->

<div class="buttons">

  <button class="action-btn" type="button">
    <span class="icon">🔓</span>
    Explicit Content
  </button>


  <button class="action-btn" type="button">
    <span class="icon">👁</span>
    +18 Livestream
  </button>

</div>


<!-- ================= IMAGE SLIDER ================= -->

<div class="slider">

  <div class="slides">

    <img src="/model1.jpg" alt="Kokree photo">
    <img src="/model2.jpg" alt="Kokree photo">
    <img src="/model3.jpg" alt="Kokree photo">

  </div>


  <button
    class="prev"
    type="button"
    onclick="moveSlide(-1)"
    aria-label="Previous photo"
  >
    ‹
  </button>


  <button
    class="next"
    type="button"
    onclick="moveSlide(1)"
    aria-label="Next photo"
  >
    ›
  </button>

</div>

</section>

</main>

<script>

let currentSlide = 0;

const slides = document.querySelector(".slides");
const images = document.querySelectorAll(".slides img");
const totalSlides = images.length;

function showSlide() {

  if (!slides || totalSlides === 0) {
    return;
  }

  slides.style.transform =
    "translateX(-" + (currentSlide * 100) + "%)";
}

function moveSlide(direction) {

  if (totalSlides === 0) {
    return;
  }

  currentSlide += direction;

  if (currentSlide >= totalSlides) {
    currentSlide = 0;
  }

  if (currentSlide < 0) {
    currentSlide = totalSlides - 1;
  }

  showSlide();
}

showSlide();

setInterval(function () {
  moveSlide(1);
}, 3000);

</script>

</body>

</html>
