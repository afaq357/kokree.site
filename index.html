<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kokree</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #ff69b4
  color: #111;
}

body {
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 700px;
  min-height: 100vh;
  background: #fff;
}

.profile {
  width: 100%;
  padding: 0 0 30px;
}


/* ================= COVER PHOTO ================= */

.cover-photo {
  width: 100%;
  height: 220px;
  overflow: hidden;
  margin: 0 0 20px;
}

.cover-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}


/* ================= BUTTONS ================= */

.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 16px 0 24px;
  padding: 0 34px;
}

.action-btn {
  width: 100%;
  height: 38px;
  min-height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
  border-radius: 22px;

  background: #000;
  color: #fff;

  font-size: 16px;
  font-weight: 700;

  text-decoration: none;
  cursor: pointer;

  gap: 7px;
  padding: 0 10px;
}

.action-btn .icon {
  font-size: 17px;
  line-height: 1;
}

.down-arrow {
  font-size: 24px;
  font-weight: 900;
  line-height: 1;
}


/* ================= SLIDER ================= */

.slider {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #fff;
  margin: 15px 0 0;
  aspect-ratio: 2 / 3;
}

.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform .5s ease;
}

.slides img {
  display: block;
  width: 100%;
  min-width: 100%;
  flex: 0 0 100%;
  height: 100%;
  object-fit: cover;
}


/* ================= PAGINATION ================= */

.pagination {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;

  background: #fff;

  padding: 12px 0 10px;
}

.pagination button {
  border: none;
  background: transparent;

  color: #111;

  font-size: 16px;
  font-weight: 700;

  cursor: pointer;
  padding: 4px 6px;
}

.pagination button.active {
  font-weight: 900;
}


/* ================= MOBILE ================= */

@media (max-width: 480px) {

  .page {
    width: 100%;
    max-width: 100%;
  }

  .profile {
    padding: 0 0 25px;
  }

  .cover-photo {
    width: 100%;
    height: 200px;
    margin: 0 0 20px;
  }

  .cover-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .buttons {
    width: 100%;
    padding: 0 34px;
    margin: 14px 0 20px;
    gap: 12px;
  }

  .action-btn {
    width: 100%;
    height: 38px;
    min-height: 38px;
    border-radius: 22px;
    font-size: 16px;
  }

  .slider {
    width: 100%;
    aspect-ratio: 2 / 3;
  }

  .slides {
    width: 100%;
    height: 100%;
  }

  .slides img {
    width: 100%;
    min-width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .pagination {
    padding: 12px 0 10px;
    gap: 18px;
  }

  .pagination button {
    font-size: 16px;
  }

}

</style>


<!-- ================= ADSTERRA POPUNDER ================= -->

<script
  data-cfasync="false"
  src="https://inputoppose.com/7d/f9/97/7df9977abe41cb9ab0b703a1cdd40951.js">
</script>


</head>


<body>

<main class="page">

<section class="profile">


<!-- ================= COVER PHOTO ================= -->

<div class="cover-photo">

  <img
    src="/IMG_0285.jpeg"
    alt="Kokree cover"
  >

</div>


<!-- ================= BUTTONS ================= -->

<div class="buttons">

  <button class="action-btn" type="button">

    <span class="icon">🔓</span>

    Thousands of Models <span class="down-arrow">↓</span>

  </button>


  <button class="action-btn" type="button">

    <span class="icon">👁</span>

    View More

  </button>

</div>


<!-- ================= IMAGE SLIDER ================= -->

<div class="slider">

  <div class="slides">

    <img
      src="/model1.jpg"
      alt="Kokree photo"
    >

    <img
      src="/model2.jpg"
      alt="Kokree photo"
    >

    <img
      src="/model3.jpg"
      alt="Kokree photo"
    >

  </div>

</div>


<!-- ================= PAGINATION ================= -->

<div class="pagination">

  <button
    type="button"
    onclick="goToSlide(0)"
    id="page1"
  >
    1
  </button>

  <button
    type="button"
    onclick="goToSlide(1)"
    id="page2"
  >
    2
  </button>

  <button
    type="button"
    onclick="goToSlide(2)"
    id="page3"
  >
    3
  </button>

  <button
    type="button"
    onclick="nextSlide()"
  >
    Next
  </button>

</div>


</section>

</main>


<script>

let currentSlide = 0;

const slides = document.querySelector(".slides");

const images =
  document.querySelectorAll(".slides img");

const totalSlides = images.length;


function showSlide() {

  if (!slides || totalSlides === 0) {
    return;
  }

  slides.style.transform =
    "translateX(-" +
    (currentSlide * 100) +
    "%)";

}


function updatePagination() {

  const buttons =
    document.querySelectorAll(".pagination button");

  buttons.forEach(function(button, index) {

    if (index < totalSlides) {

      button.classList.toggle(
        "active",
        index === currentSlide
      );

    }

  });

}


function goToSlide(index) {

  if (index < 0 || index >= totalSlides) {
    return;
  }

  currentSlide = index;

  showSlide();

  updatePagination();

}


function nextSlide() {

  currentSlide++;

  if (currentSlide >= totalSlides) {

    currentSlide = 0;

  }

  showSlide();

  updatePagination();

}


showSlide();

updatePagination();

</script>


</body>

</html>
