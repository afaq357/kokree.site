<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kokree</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

  <section class="profile">

    <!-- PROFILE -->
    <div class="profile-top">

      <div class="profile-photo">
        <img src="/profile.jpg" alt="Kokree">
        <span class="online"></span>
      </div>

      <div class="profile-details">

        <h1>
          KOKREE
          <span class="verified">✓</span>
          <span class="flag">🇺🇸</span>
        </h1>

        <div class="stars">★★★★★</div>

        <div class="numbers">
          <span>▣ <b>205</b> videos</span>
          <span>▧ <b>340</b> photos</span>
        </div>

      </div>

    </div>

    <!-- BUTTONS -->
   <div class="buttons">

<a class="action-btn" href="https://t.ajrkmx3.com/421332/8780/32511?source=Facebook&po=6533&aff_sub5=SF_006OG000004lmDN" target="_blank" rel="noopener">
  <span>▶</span> +18 Livestream
</a>

  <button class="action-btn">
    <span>▧</span> Explicit Content
  </button>

   </div> 
    <!-- IMAGE SLIDER -->
    <div class="slider">

      <div class="slides">

        <img src="/model1.jpg" alt="Kokree photo">
        <img src="/model2.jpg" alt="Kokree photo">
        <img src="/model3.jpg" alt="Kokree photo">

      </div>

      <button class="prev" onclick="moveSlide(-1)">‹</button>
      <button class="next" onclick="moveSlide(1)">›</button>

    </div>

  </section>

</main>

<script>

let currentSlide = 0;

const slides = document.querySelector(".slides");
const totalSlides = document.querySelectorAll(".slides img").length;

function showSlide() {
  slides.style.transform =
    "translateX(-" + (currentSlide * 100) + "%)";
}

function moveSlide(direction) {

  currentSlide += direction;

  if (currentSlide >= totalSlides) {
    currentSlide = 0;
  }

  if (currentSlide < 0) {
    currentSlide = totalSlides - 1;
  }

  showSlide();
}

/* AUTOMATIC SCROLL */
setInterval(function() {
  moveSlide(1);
}, 3000);

</script>

</body>
</html>
