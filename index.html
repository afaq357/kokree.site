<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kokree</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: pink;
  color: #111;
}

body {
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 700px;
  min-height: 100vh;
  background: pink;
}

.profile {
  width: 100%;
  padding: 0 0 30px;
}


/* ================= COVER PHOTO ================= */

.cover-photo {
  width: 100%;
  height: 220px;
  overflow: hidden;
  margin: 0 0 20px;
}

.cover-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}


/* ================= BUTTONS ================= */

.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 16px 0 24px;
  padding: 0 34px;
}

.action-btn {
  width: 100%;
  height: 38px;
  min-height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
  border-radius: 22px;

  background: #000000;
  color: #fff;

  font-size: 16px;
  font-weight: 700;

  text-decoration: none;
  cursor: pointer;

  gap: 7px;
  padding: 0 10px;
}

.action-btn .icon {
  font-size: 17px;
  line-height: 1;
}


/* ================= DOWN ARROW ================= */

.down-arrow {
  font-size: 22px;
  font-weight: 1100;
  line-height: 1;
}


/* ================= SLIDER ================= */

.slider {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #eee;
  margin: 15px 0 20px;
  aspect-ratio: 2 / 3;
}

.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform .5s ease;
}

.slides img {
  display: block;
  width: 100%;
  min-width: 100%;
  flex: 0 0 100%;
  height: 100%;
  object-fit: cover;
}


/* ================= SLIDER ARROWS ================= */

.prev,
.next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);

  width: 45px;
  height: 60px;

  border: 0;
  background: transparent;
  color: #fff;

  font-size: 55px;
  font-weight: bold;
  line-height: 55px;

  z-index: 5;
  cursor: pointer;

  padding: 0;

  text-shadow: 0 2px 5px rgba(0,0,0,.7);
}

.prev {
  left: 5px;
}

.next {
  right: 5px;
}


/* ================= MOBILE ================= */

@media (max-width: 480px) {

  .page {
    width: 100%;
    max-width: 100%;
  }

  .profile {
    padding: 0 0 25px;
  }

  .cover-photo {
    width: 100%;
    height: 200px;
    margin: 0 0 20px;
  }

  .cover-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .buttons {
    width: 100%;
    padding: 0 34px;
    margin: 14px 0 20px;
    gap: 12px;
  }

  .action-btn {
    width: 100%;
    height: 38px;
    min-height: 38px;
    border-radius: 22px;
    font-size: 16px;
  }

  .slider {
    width: 100%;
    aspect-ratio: 2 / 3;
  }

  .slides {
    width: 100%;
    height: 100%;
  }

  .slides img {
    width: 100%;
    min-width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .prev,
  .next {
    width: 45px;
    height: 60px;
    font-size: 55px;
  }

}

</style>


<!-- ================= ADSTERRA POPUNDER ================= -->

<script
  data-cfasync="false"
  src="https://inputoppose.com/7d/f9/97/7df9977abe41cb9ab0b703a1cdd40951.js">
</script>


</head>


<body>

<main class="page">

<section class="profile">


<!-- ================= COVER PHOTO ================= -->

<div class="cover-photo">

  <img
    src="/IMG_0285.jpeg"
    alt="Kokree cover"
  >

</div>


<!-- ================= BUTTONS ================= -->

<div class="buttons">

  <button class="action-btn" type="button">

    <span class="icon">🔓</span>

    Thousands of Models <span class="down-arrow">↓</span>

  </button>


  <button class="action-btn" type="button">

    <span class="icon">👁</span>

    +18 Livestream

  </button>

</div>


<!-- ================= IMAGE SLIDER ================= -->

<div class="slider">

  <div class="slides">

    <img
      src="/model1.jpg"
      alt="Kokree photo"
    >

    <img
      src="/model2.jpg"
      alt="Kokree photo"
    >

    <img
      src="/model3.jpg"
      alt="Kokree photo"
    >

  </div>


  <button
    class="prev"
    type="button"
    onclick="moveSlide(-1)"
    aria-label="Previous photo"
  >
    ‹
  </button>


  <button
    class="next"
    type="button"
    onclick="moveSlide(1)"
    aria-label="Next photo"
  >
    ›
  </button>

</div>


</section>

</main>


<script>

let currentSlide = 0;

const slides = document.querySelector(".slides");

const images =
  document.querySelectorAll(".slides img");

const totalSlides = images.length;


function showSlide() {

  if (!slides || totalSlides === 0) {
    return;
  }

  slides.style.transform =
    "translateX(-" +
    (currentSlide * 100) +
    "%)";

}


function moveSlide(direction) {

  if (totalSlides === 0) {
    return;
  }

  currentSlide += direction;


  if (currentSlide >= totalSlides) {

    currentSlide = 0;

  }


  if (currentSlide < 0) {

    currentSlide = totalSlides - 1;

  }


  showSlide();

}


showSlide();


setInterval(function () {

  moveSlide(1);

}, 3000);

</script>


</body>

</html>
