<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kokree</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #ff69b4;
  color: #111;
}

body {
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 700px;
  min-height: 100vh;
  background: #ff69b4;
}

.profile {
  width: 100%;
  padding: 0 0 30px;
}


/* ================= COVER PHOTO ================= */

.cover-photo {
  width: 100%;
  height: 175px;
  overflow: hidden;
  margin: 0 0 14px;
}

.cover-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}


/* ================= SEARCH BAR ================= */

.search-box {
  width: 100%;
  padding: 0 34px;
  margin: 0 0 14px;
}

.search-bar {
  width: 100%;
  height: 42px;

  display: flex;
  align-items: center;

  background: #fff;
  border-radius: 22px;

  padding: 0 16px;

  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
}

.search-icon {
  font-size: 18px;
  margin-right: 8px;
}

.search-bar input {
  width: 100%;
  height: 100%;

  border: none;
  outline: none;

  background: transparent;

  font-size: 15px;
  color: #111;
}

.search-bar input::placeholder {
  color: #777;
}


/* ================= BUTTONS ================= */

.buttons {
  width: 80%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 0 0 24px;
  padding: 0 55px;
}

.action-btn {
  width: 80%;
  height: 38px;
  min-height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
  border-radius: 22px;

  background: #333;
  color: #fff;

  font-size: 15px;
  font-weight: 700;

  text-decoration: none;
  cursor: pointer;

  gap: 7px;
  padding: 0 10px;
}

.action-btn .icon {
  font-size: 17px;
  line-height: 1;
}

.down-arrow {
  font-size: 24px;
  font-weight: 900;
  line-height: 1;
}


/* ================= SLIDER ================= */

.slider {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #222;
  margin: 15px 0 0;
  aspect-ratio: 2 / 3;
}

.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform .5s ease;
}

.slide-item {
  position: relative;
  width: 100%;
  min-width: 100%;
  flex: 0 0 100%;
  height: 100%;
  overflow: hidden;
}

.slide-item img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}


/* ================= PLAY ICON ================= */

.play-circle {
  position: absolute;

  top: 50%;
  left: 50%;

  width: 76px;
  height: 76px;

  transform: translate(-50%, -50%);

  border: 3px solid rgba(255, 255, 255, 0.85);
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  animation: playPulse 1.8s ease-in-out infinite;

  pointer-events: none;
}

.play-icon {
  color: #fff;
  font-size: 32px;
  line-height: 1;

  margin-left: 4px;

  text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
}

@keyframes playPulse {

  0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.85;
  }

  50% {
    transform: translate(-50%, -50%) scale(1.10);
    opacity: 1;
  }

  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.85;
  }

}


/* ================= PAGINATION ================= */

.pagination {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;

  background: #222;

  padding: 12px 0 10px;
}

.pagination button {
  border: none;
  background: transparent;

  color: #fff;

  font-size: 16px;
  font-weight: 700;

  cursor: pointer;
  padding: 4px 6px;
}

.pagination button.active {
  font-weight: 900;
}


/* ================= MOBILE ================= */

@media (max-width: 480px) {

  .page {
    width: 100%;
    max-width: 100%;
  }

  .profile {
    padding: 0;
  }

  .cover-photo {
    width: 100%;
    height: 165px;
    margin: 0 0 14px;
  }

  .cover-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .search-box {
    width: 100%;
    padding: 0 55px;
    margin: 0 0 14px;
  }

  .search-bar {
    height: 42px;
    border-radius: 22px;
    padding: 0 16px;
  }

  .search-icon {
    font-size: 18px;
  }

  .search-bar input {
    font-size: 15px;
  }

  .buttons {
    width: 100%;
    padding: 0 34px;
    margin: 0 0 20px;
    gap: 12px;
  }

  .action-btn {
    width: 100%;
    height: 38px;
    min-height: 38px;
    border-radius: 22px;
    font-size: 16px;
  }

  .slider {
    width: 100%;
    aspect-ratio: 2 / 3;
  }

  .slides {
    width: 100%;
    height: 100%;
  }

  .slide-item {
    width: 100%;
    min-width: 100%;
    height: 100%;
  }

  .slide-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .play-circle {
    width: 70px;
    height: 70px;
  }

  .play-icon {
    font-size: 29px;
  }

  .pagination {
    padding: 12px 0 10px;
    gap: 18px;
  }

  .pagination button {
    font-size: 16px;
  }

}

</style>


<!-- ================= ADSTERRA POPUNDER ================= -->

<script
  data-cfasync="false"
  src="https://inputoppose.com/7d/f9/97/7df9977abe41cb9ab0b703a1cdd40951.js">
</script>


</head>


<body>

<main class="page">

<section class="profile">


<!-- ================= COVER PHOTO ================= -->

<div class="cover-photo">

  <img
    src="/IMG_0285.jpeg"
    alt="Kokree cover"
  >

</div>


<!-- ================= SEARCH BAR ================= -->

<div class="search-box">

  <div class="search-bar">

    <span class="search-icon">🔍</span>

    <input
      type="text"
      placeholder="Search..."
      aria-label="Search"
    >

  </div>

</div>


<!-- ================= BUTTONS ================= -->

<div class="buttons">

  <button class="action-btn" type="button">

    <span class="icon">🔓</span>

    Thousands of Models <span class="down-arrow">↓</span>

  </button>


  <button class="action-btn" type="button">

    <span class="icon">👁</span>

    View More

  </button>

</div>


<!-- ================= IMAGE SLIDER ================= -->

<div class="slider">

  <div class="slides">


    <div class="slide-item">

      <img
        src="/model1.jpg"
        alt="Kokree photo"
      >

      <div class="play-circle">
        <span class="play-icon">▶</span>
      </div>

    </div>


    <div class="slide-item">

      <img
        src="/model2.jpg"
        alt="Kokree photo"
      >

      <div class="play-circle">
        <span class="play-icon">▶</span>
      </div>

    </div>


    <div class="slide-item">

      <img
        src="/model3.jpg"
        alt="Kokree photo"
      >

      <div class="play-circle">
        <span class="play-icon">▶</span>
      </div>

    </div>


  </div>

</div>


<!-- ================= PAGINATION ================= -->

<div class="pagination">

  <button
    type="button"
    onclick="goToSlide(0)"
    id="page1"
  >
    1
  </button>

  <button
    type="button"
    onclick="goToSlide(1)"
    id="page2"
  >
    2
  </button>

  <button
    type="button"
    onclick="goToSlide(2)"
    id="page3"
  >
    3
  </button>

  <button
    type="button"
    onclick="nextSlide()"
  >
    Next
  </button>

</div>


</section>

</main>


<script>

let currentSlide = 0;

const slides = document.querySelector(".slides");

const images =
  document.querySelectorAll(".slide-item");

const totalSlides = images.length;


function showSlide() {

  if (!slides || totalSlides === 0) {
    return;
  }

  slides.style.transform =
    "translateX(-" +
    (currentSlide * 100) +
    "%)";

}


function updatePagination() {

  const buttons =
    document.querySelectorAll(".pagination button");

  buttons.forEach(function(button, index) {

    if (index < totalSlides) {

      button.classList.toggle(
        "active",
        index === currentSlide
      );

    }

  });

}


function goToSlide(index) {

  if (index < 0 || index >= totalSlides) {
    return;
  }

  currentSlide = index;

  showSlide();

  updatePagination();

}


function nextSlide() {

  currentSlide++;

  if (currentSlide >= totalSlides) {

    currentSlide = 0;

  }

  showSlide();

  updatePagination();

}


showSlide();

updatePagination();

</script>


</body>

</html>
