<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kokree</title>

  <link rel="stylesheet" href="style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
    }

    .profile {
      width: 100%;
      padding: 18px 16px 30px;
    }

    /* ==================== PROFILE ==================== */

    .profile-top {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
    }

    .profile-photo {
      position: relative;
      flex-shrink: 0;
    }

    .profile-photo img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .online {
      position: absolute;
      right: 2px;
      bottom: 5px;
      width: 24px;
      height: 24px;
      background: #19c52b;
      border: 4px solid white;
      border-radius: 50%;
    }

    .profile-details {
      flex: 1;
    }

    .profile-details h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: #304bdc;
      color: white;
      border-radius: 50%;
      font-size: 14px;
      vertical-align: middle;
    }

    .flag {
      font-size: 27px;
      margin-left: 4px;
    }

    .stars {
      color: #f7bd00;
      font-size: 29px;
      letter-spacing: 1px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .numbers {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 17px;
      color: #d05b9b;
    }

    .numbers b {
      font-size: 20px;
      color: #d05b9b;
    }

    .numbers span {
      color: #d05b9b;
    }

    .video-icon,
    .photo-icon {
      display: inline-flex;
      width: 27px;
      height: 27px;
      color: #24348d !important;
      margin-left: 2px;
    }

    .video-icon svg,
    .photo-icon svg {
      width: 100%;
      height: 100%;
    }

    /* ==================== JERKMATE BANNER ==================== */

    .jerkmate-banner {
      width: 100%;
      display: block;
      margin: 10px 0 18px;
      overflow: hidden;
      border-radius: 3px;
    }

    .jerkmate-banner img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }

    /* ==================== BUTTONS ==================== */

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: 0 0 28px;
    }

    .action-btn {
      width: 100%;
      min-height: 72px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      border: none;
      border-radius: 45px;

      background: #1235c5;
      color: white;

      font-size: 25px;
      font-weight: 800;

      text-decoration: none;
      cursor: pointer;

      transition: transform .15s ease, opacity .15s ease;
    }

    .action-btn:hover {
      opacity: .92;
    }

    .action-btn:active {
      transform: scale(.98);
    }

    .action-btn .icon {
      font-size: 27px;
      line-height: 1;
    }

    /* ==================== IMAGE SLIDER ==================== */

    .slider {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #eee;
    }

    .slides {
      display: flex;
      width: 100%;
      transition: transform .45s ease;
    }

    .slides img {
      width: 100%;
      min-width: 100%;
      height: auto;
      max-height: 850px;
      object-fit: cover;
      display: block;
    }

    .prev,
    .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 42px;
      height: 55px;

      border: none;
      background: rgba(0,0,0,.12);
      color: white;

      font-size: 42px;
      line-height: 1;

      cursor: pointer;
      text-shadow: 0 1px 4px rgba(0,0,0,.6);
    }

    .prev {
      left: 0;
    }

    .next {
      right: 0;
    }

    /* ==================== MOBILE ==================== */

    @media (max-width: 600px) {

      .profile {
        padding: 16px 16px 25px;
      }

      .profile-top {
        gap: 14px;
      }

      .profile-photo img {
        width: 92px;
        height: 92px;
      }

      .online {
        width: 22px;
        height: 22px;
      }

      .profile-details h1 {
        font-size: 27px;
      }

      .stars {
        font-size: 27px;
      }

      .numbers {
        font-size: 15px;
      }

      .numbers b {
        font-size: 18px;
      }

      .action-btn {
        min-height: 68px;
        font-size: 23px;
      }

    }

  </style>

</head>

<!-- ==================== SLIDER SCRIPT ==================== -->

<script>

  let currentSlide = 0;

  const slides = document.querySelector(".slides");

  const totalSlides =
    document.querySelectorAll(".slides img").length;


  function showSlide() {

    slides.style.transform =
      "translateX(-" +
      (currentSlide * 100) +
      "%)";

  }


  function moveSlide(direction) {

    currentSlide += direction;


    if (currentSlide >= totalSlides) {
      currentSlide = 0;
    }


    if (currentSlide < 0) {
      currentSlide = totalSlides - 1;
    }


    showSlide();

  }


  setInterval(function() {

    moveSlide(1);

  }, 3000);

</script>
